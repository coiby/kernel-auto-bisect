name: Build tmt e2e container

on:
  pull_request:
    paths:
      - .github/containers/tmt-e2e/**
      - .github/workflows/tmt-e2e-container.yml
      - tests/kab_criu/test.sh
  push:
    branches: [main]
    paths:
      - .github/containers/tmt-e2e/**
      - .github/workflows/tmt-e2e-container.yml
      - tests/kab_criu/test.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-tmt-e2e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build customized Fedora image
        run: |
          mkdir -p .github/containers/tmt-e2e/images
          docker run --rm --privileged \
            -v "${PWD}/.github/containers/tmt-e2e:/workspace" \
            -e KAB_IMAGE_DIR=/workspace/images \
            quay.io/fedora/fedora:43 \
            bash -lc 'dnf install -yq createrepo_c curl dnf5-plugins guestfs-tools passt && dnf clean all && /workspace/build-image.sh'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .github/containers/tmt-e2e
          file: .github/containers/tmt-e2e/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
