name: KAB tmt e2e tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Full e2e tests  ────
  #
  # Uses GitHub-hosted runners with nested KVM. Each plan provisions
  # two Fedora VMs via testcloud and runs the bisection end-to-end.
  #
  tmt-run:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:latest
      options: "--privileged -v /dev:/dev"
    strategy:
      fail-fast: false
      matrix:
        plan: [criu]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6

      - name: Install tmt
        run: |
          dnf install tmt+provision-virtual -yq
          systemctl start libvirtd
          # verify KVM is available
          test -e /dev/kvm && echo "KVM OK" || echo "WARNING: /dev/kvm missing"
          virsh list --all

      - name: TMT mimi
        run: |
          mkdir /tmp/test_tmt && cd /tmp/test_tmt
          tmt init -t mini
          tmt run -a provision -h virtual -c system -i fedora:43 execute -vvv
